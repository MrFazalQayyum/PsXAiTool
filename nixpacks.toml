# Root-level nixpacks config — used when Railway service Root Directory is "/"
# For the backend service deployed from the repo root.
# Celery services override the start command in the Railway dashboard.

[phases.setup]
nixPkgs = ["python311", "gcc", "libpq"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
