version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: psx_postgres
    environment:
      POSTGRES_DB: psx_intelligence
      POSTGRES_USER: psx_user
      POSTGRES_PASSWORD: psx_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psx_user -d psx_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: psx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:
