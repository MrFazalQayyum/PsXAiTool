# Railway configuration for PsXAiTool (.NET 8 / Blazor Server)
# One service: the Blazor app runs the API, background jobs (Hangfire), and UI together.
#
# Required environment variables to set in the Railway service dashboard:
#   DATABASE_URL       — auto-populated by the Railway PostgreSQL plugin
#   ANTHROPIC_API_KEY  — your Anthropic API key
#   VAPID_PUBLIC_KEY   — generated with: npx web-push generate-vapid-keys
#   VAPID_PRIVATE_KEY  — as above
#   VAPID_SUBJECT      — e.g. mailto:you@example.com

[build]
builder = "dockerfile"
dockerfilePath = "dotnet/Dockerfile"
# Build context must be the repo root so the Dockerfile can reach data/psx_companies.csv
dockerContext = "."

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
