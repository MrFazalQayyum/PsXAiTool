# Railway monorepo — 4 services total
#
# Recommended: In the Railway dashboard, create 4 services from this repo
# and set each service's Root Directory so nixpacks only sees the right code:
#
#  Service          Root Directory   Start Command (override in dashboard)
#  ─────────────────────────────────────────────────────────────────────────
#  fastapi-backend  backend          (auto — reads backend/railway.toml)
#  celery-worker    backend          celery -A app.core.celery_app worker --loglevel=info --concurrency=2
#  celery-beat      backend          celery -A app.core.celery_app beat --loglevel=info
#  nextjs-frontend  frontend         (auto — reads frontend/railway.toml)
#
# If Root Directory is left as "/" (repo root), this file and root nixpacks.toml
# are used — the default start command runs the FastAPI backend.
#
# Required environment variables:
#
#  backend services:
#    DATABASE_URL        → link Postgres plugin  (${{ Postgres.DATABASE_PRIVATE_URL }})
#    REDIS_URL           → link Redis plugin      (${{ Redis.REDIS_PRIVATE_URL }})
#    ANTHROPIC_API_KEY   → your Anthropic API key
#    FRONTEND_URL        → https://<nextjs-frontend.up.railway.app>
#    VAPID_PUBLIC_KEY    → generated by: python backend/scripts/gen_vapid.py
#    VAPID_PRIVATE_KEY   → generated by: python backend/scripts/gen_vapid.py
#    VAPID_CLAIMS_EMAIL  → mailto:you@example.com
#
#  nextjs-frontend:
#    BACKEND_URL                  → http://<fastapi-backend>.railway.internal
#    NEXT_PUBLIC_VAPID_PUBLIC_KEY → same value as VAPID_PUBLIC_KEY

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
