# Railway monorepo — 4 services total
#
# Create each service in the Railway dashboard and set its Root Directory:
#
#  Service          Root Directory   Start Command
#  ─────────────────────────────────────────────────────────────────────────
#  fastapi-backend  backend          uvicorn app.main:app --host 0.0.0.0 --port $PORT
#  celery-worker    backend          celery -A app.core.celery_app worker --loglevel=info --concurrency=2
#  celery-beat      backend          celery -A app.core.celery_app beat --loglevel=info
#  nextjs-frontend  frontend         npm run start
#
# Required environment variables per service:
#
#  fastapi-backend & celery-*:
#    DATABASE_URL        → link Postgres plugin  (DATABASE_PRIVATE_URL)
#    REDIS_URL           → link Redis plugin      (REDIS_PRIVATE_URL)
#    ANTHROPIC_API_KEY   → your Anthropic key
#    FRONTEND_URL        → https://<nextjs-frontend.up.railway.app>
#    VAPID_PUBLIC_KEY    → generated by scripts/gen_vapid.py
#    VAPID_PRIVATE_KEY   → generated by scripts/gen_vapid.py
#    VAPID_CLAIMS_EMAIL  → mailto:you@example.com
#    SMTP_USER           → (optional) Gmail address
#    SMTP_PASSWORD       → (optional) Gmail app password
#    ALERT_EMAIL         → (optional) alert destination
#
#  nextjs-frontend:
#    BACKEND_URL         → http://<fastapi-backend.railway.internal>  (internal Railway URL)
#    NEXT_PUBLIC_VAPID_PUBLIC_KEY → same VAPID_PUBLIC_KEY as backend

[build]
builder = "nixpacks"
